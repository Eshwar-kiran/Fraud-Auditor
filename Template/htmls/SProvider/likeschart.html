{% extends 'SProvider/Header.html' %}
{% block researchblock %}


<style>

.glass-card{
    background:#ffffff;
    border-radius:20px;
    padding:30px;
    box-shadow:0px 10px 30px rgba(0,0,0,0.15);
}

</style>


<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-lg-10">

            <div class="glass-card">


                <h2 class="text-center text-primary fw-bold mb-2">
                    Machine Learning Algorithm Accuracy
                </h2>


                <p class="text-center text-muted mb-4">
                    Comparison of prediction accuracy percentage.
                </p>


                <div id="chartContainer" style="height:500px;width:100%;"></div>


            </div>

        </div>

    </div>

</div>



<script src="https://canvasjs.com/assets/script/canvasjs.min.js"></script>



<script>

window.onload = function () {


var chart = new CanvasJS.Chart("chartContainer", {


    animationEnabled:true,

    theme:"light2",


    title:{

        text:"Detection Accuracy (%)"

    },


    {% if like_chart != "pie" %}

    axisY:{

        title:"Accuracy Percentage",

        suffix:"%",

        includeZero:true

    },

    {% endif %}



    data:[{

        
        {% if like_chart == "pie" %}

        type:"pie",

        showInLegend:true,

        legendText:"{label}",

        toolTipContent:"<b>{label}</b>: {y}%"



        {% elif like_chart == "line" %}

        type:"line"



        {% elif like_chart == "spline" %}

        type:"spline"



        {% else %}

        type:"column"



        {% endif %}



        indexLabel:"{y}%",

        indexLabelPlacement:"outside",



        dataPoints:[


        {% for o in form %}


        {

            y: {{o.dcount|floatformat:2}},

            label:"{{o.names|escapejs}}"

        }


        {% if not forloop.last %},{% endif %}


        {% empty %}


        {

            y:0,

            label:"No Data"

        }


        {% endfor %}


        ]


    }]



});


chart.render();


};


</script>


{% endblock %}
