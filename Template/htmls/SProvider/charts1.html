{% extends 'SProvider/Header.html' %}

{% load static %}

{% block researchblock %}


<link rel="stylesheet" href="{% static 'css/style.css' %}">


<div class="chart-page">


    <div class="side-menu">


        <h3>
            <a href="{% url 'charts1' 'pie' %}">
                PIE CHART
            </a>
        </h3>


        <h3>
            <a href="{% url 'charts1' 'line' %}">
                LINE CHART
            </a>
        </h3>


        <h3>
            <a href="{% url 'charts1' 'spline' %}">
                SPLINE CHART
            </a>
        </h3>


    </div>



    <div class="chart-card">


        <h2 class="chart-title">
            Machine Learning Model Accuracy
        </h2>


        <div id="chartContainer"></div>


    </div>



</div>



<script src="https://canvasjs.com/assets/script/canvasjs.min.js"></script>


<script>


window.onload=function(){


var chart = new CanvasJS.Chart("chartContainer",{


    animationEnabled:true,

    theme:"light2",


    title:{

        text:"Detection Accuracy Percentage"

    },


    data:[{


        {% if chart_type == "line" %}

        type:"line",


        {% elif chart_type == "pie" %}

        type:"pie",

        showInLegend:true,


        {% elif chart_type == "spline" %}

        type:"spline",


        {% else %}

        type:"column",


        {% endif %}


        indexLabel:"{label}: {y}%",


        yValueFormatString:"##0.00%",



        dataPoints:[


        {% for o in form %}


        {

            y:{{o.dcount|floatformat:2}},

            label:"{{o.names|escapejs}}"

        }


        {% if not forloop.last %},{% endif %}


        {% empty %}


        {

            y:0,

            label:"No Data"

        }


        {% endfor %}


        ]



    }]


});


chart.render();


}



</script>



{% endblock %}
