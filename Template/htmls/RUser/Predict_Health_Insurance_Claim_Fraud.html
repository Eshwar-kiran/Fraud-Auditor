{% extends 'RUser/Header.html' %}
{% load static %}

{% block userblock %}

<div class="container py-5">

<div class="row justify-content-center">

<div class="col-lg-11">

<div class="glass-card prediction-card">

<h2 class="text-center mb-2">
Healthcare Insurance Claim Fraud Prediction
</h2>

<p class="text-center text-muted mb-4">
Enter the patient and insurance details to predict whether the claim is fraudulent.
</p>

<form method="POST">

{% csrf_token %}

<div class="row">

<div class="col-md-6 mb-3">
<label>RID</label>
<input type="text" class="form-control prediction-input" name="RID" required>
</div>

<div class="col-md-6 mb-3">
<label>Sum Insured</label>
<input type="text" class="form-control prediction-input" name="Sum_Insured" required>
</div>

<div class="col-md-6 mb-3">
<label>Age</label>
<input type="text" class="form-control prediction-input" name="age" required>
</div>

<div class="col-md-6 mb-3">
<label>Gender</label>
<select class="form-select prediction-input" name="sex" required>
<option value="">Select Gender</option>
<option>Male</option>
<option>Female</option>
</select>
</div>

<div class="col-md-6 mb-3">
<label>Weight</label>
<input type="text" class="form-control prediction-input" name="weight" required>
</div>

<div class="col-md-6 mb-3">
<label>BMI</label>
<input type="text" class="form-control prediction-input" name="bmi" required>
</div>

<div class="col-md-6 mb-3">
<label>Hereditary Diseases</label>
<input type="text" class="form-control prediction-input" name="hereditary_diseases">
</div>

<div class="col-md-6 mb-3">
<label>No. of Dependents</label>
<select class="form-select prediction-input" name="no_of_dependents">
<option>0</option>
<option>1</option>
<option>2</option>
<option>3</option>
<option>4</option>
<option>5</option>
<option>6</option>
<option>7</option>
<option>8</option>
<option>9</option>
<option>10</option>
</select>
</div>

<div class="col-md-6 mb-3">
<label>Smoker</label>
<select class="form-select prediction-input" name="smoker">
<option>0</option>
<option>1</option>
</select>
</div>

<div class="col-md-6 mb-3">
<label>City</label>
<input type="text" class="form-control prediction-input" name="city">
</div>

<div class="col-md-6 mb-3">
<label>Blood Pressure</label>
<input type="text" class="form-control prediction-input" name="bloodpressure">
</div>

<div class="col-md-6 mb-3">
<label>Diabetes</label>
<select class="form-select prediction-input" name="diabetes">
<option>0</option>
<option>1</option>
</select>
</div>

<div class="col-md-6 mb-3">
<label>Regular Exercise</label>
<select class="form-select prediction-input" name="regular_ex">
<option>0</option>
<option>1</option>
</select>
</div>

<div class="col-md-6 mb-3">
<label>Job Title</label>
<input type="text" class="form-control prediction-input" name="job_title">
</div>

<div class="col-12 mb-4">
<label>Claim Amount</label>
<input type="text" class="form-control prediction-input" name="claim">
</div>

<div class="col-12">

<button type="submit" class="btn predict-btn w-100">

Predict Fraud

</button>

</div>

</div>

</form>

{% if objs %}

<div class="alert prediction-result mt-4 text-center">

<h4 class="mb-0">

Prediction Result :
<strong>{{ objs }}</strong>

</h4>

</div>

{% endif %}

</div>

</div>

</div>

</div>

{% endblock %}
